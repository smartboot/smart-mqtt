server:
  debug: false
  bannerEnabled: false
  threadNum: 4
  readBufferSize: 8192
  writeBufferSize: 8192
  gzip: true
  gzipThreshold: 256

mqtt:
  port: ${mqtt.port:1883}
  host: ${mqtt.host:0.0.0.0}
  maxPacketSize: ${mqtt.maxPacketSize}
  maxInFlight: ${mqtt.maxInFlight}
  threadNum: ${mqtt.threadNum}
  bufferSize: ${mqtt.bufferSize}
  pushThreadNum: ${mqtt.pushThreadNum}
  topicLimit: ${mqtt.topicLimit}
  maxMessageQueueLength: ${mqtt.maxMessageQueueLength}
  perfMode: ${mqtt.perfMode:true}
